[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surya-sync"
version = "0.1.0"
description = "Solar-aware residential flexible-load scheduling system"
requires-python = ">=3.11"
# Deliberately empty. Everything Phase 0 needs is in the standard library
# (tomllib, sqlite3, dataclasses). Dependencies are added per phase, and
# each one has to justify itself against the Raspberry Pi Zero budget.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ml = ["numpy", "scikit-learn"]          # Phase 5
optimize = ["pulp"]                      # Phase 8
hardware = ["pyserial"]                  # Phase 11
api = ["fastapi", "uvicorn"]             # Phase 15

[project.scripts]
surya-sync = "surya_sync.main:main"

[tool.setuptools.packages.find]
include = ["surya_sync*"]

[tool.setuptools.package-data]
surya_sync = ["config/*.toml", "storage/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
